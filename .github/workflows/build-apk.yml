name: Build PocketPal APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'true'
      ORG_GRADLE_PROJECT_rnllamaVariants: 'rnllama'
      RNLLAMA_SKIP_POSTINSTALL: '1'
      PLUS_STORE_GATE: 'true'
      APP_RELEASE_STORE_PASSWORD: dummy-ci-password
      APP_RELEASE_KEY_PASSWORD: dummy-ci-password
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Auto-Extract ZIP (If Uploaded as ZIP) & Normalize Project Root
        run: |
          set -e
          # 1. If ANY .zip archive was uploaded to the repo, extract it and overwrite root files
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -not -path "*/node_modules/*" -not -path "*/.git/*" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found archive $ZIP_FILE — extracting into temporary staging directory..."
            STAGE_DIR=$(mktemp -d)
            unzip -q -o "$ZIP_FILE" -d "$STAGE_DIR"
            rm -f "$ZIP_FILE"
            # Find the directory inside STAGE_DIR that contains BOTH package.json AND android/build.gradle (never e2e/package.json!)
            SRC_ROOT=""
            if [ -f "$STAGE_DIR/package.json" ] && [ -f "$STAGE_DIR/android/build.gradle" ]; then
              SRC_ROOT="$STAGE_DIR"
            else
              for CANDIDATE in $(find "$STAGE_DIR" -mindepth 1 -maxdepth 2 -type d); do
                if [ -f "$CANDIDATE/package.json" ] && [ -f "$CANDIDATE/android/build.gradle" ]; then
                  SRC_ROOT="$CANDIDATE"
                  break
                fi
              done
            fi
            if [ -n "$SRC_ROOT" ]; then
              echo "Copying extracted PocketPal root files from $SRC_ROOT into workspace root..."
              cp -rf "$SRC_ROOT"/. .
            fi
            rm -rf "$STAGE_DIR"
          fi

          # 2. If a nested subfolder (e.g. ./pocketpal-ai-main) contains BOTH package.json AND android/build.gradle, sync to root and remove duplicate
          for CANDIDATE in $(find . -mindepth 1 -maxdepth 1 -type d -not -name ".git" -not -name "node_modules" -not -name "e2e" -not -name "android" -not -name "ios" -not -name "src"); do
            if [ -f "$CANDIDATE/package.json" ] && [ -f "$CANDIDATE/android/build.gradle" ]; then
              echo "Found nested project root $CANDIDATE — syncing into workspace root and removing duplicate..."
              cp -rf "$CANDIDATE"/. .
              rm -rf "$CANDIDATE"
            fi
          done

          # 3. Verify root package.json is the main PocketPal package.json (and never e2e/package.json)
          node -e '
            const pkg = require("./package.json");
            console.log("Root package.json name:", pkg.name, "version:", pkg.version);
            if (pkg.name !== "PocketPal") {
              throw new Error("Invalid root package.json name: " + pkg.name);
            }
          '

          # 4. Strip Windows CRLF line endings and ensure scripts are executable
          find . \( -name "*.sh" -o -name "*.patch" -o -name "gradlew" -o -name ".env" \) -not -path "*/node_modules/*" -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          chmod +x scripts/*.sh android/gradlew 2>/dev/null || true

          # 5. Lock Android build to arm64-v8a ONLY (eliminates x86_64 emulator compilation)
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties || true
          sed -i '/rnllamaBuildFromSource=false/d' android/gradle.properties || true
          node -e '
            const fs = require("fs");
            const p = "android/app/build.gradle";
            let c = fs.readFileSync(p, "utf8");
            c = c.replace(/abiFilters\s+"arm64-v8a",\s*"x86_64"/g, "abiFilters \"arm64-v8a\"");
            fs.writeFileSync(p, c);
          '

      - name: Maximize Build Space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache || true
          sudo mkdir -p /opt/hostedtoolcache
          sudo chmod -R 777 /opt/hostedtoolcache
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Yarn & Dependencies
        run: |
          set -e
          npm install -g yarn || true
          rm -rf node_modules
          yarn install --non-interactive --check-files --network-timeout 600000
          test -d node_modules/@react-native/gradle-plugin || { echo "ERROR: node_modules/@react-native/gradle-plugin missing!"; exit 1; }
          test -d node_modules/llama.rn || { echo "ERROR: node_modules/llama.rn missing!"; exit 1; }

          # Clone OpenCL headers required by llama.rn CMake
          OPENCL_HEADERS_DIR="node_modules/llama.rn/third_party/OpenCL-Headers"
          if [ ! -d "$OPENCL_HEADERS_DIR" ]; then
            mkdir -p "node_modules/llama.rn/third_party"
            git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git "$OPENCL_HEADERS_DIR"
          fi

          # Speed up whisper.rn C++ compilation by 4x: build only the primary rnwhisper library instead of 4 redundant CPU variants
          if [ -f "node_modules/whisper.rn/android/src/main/CMakeLists.txt" ]; then
            sed -i '/rnwhisper_v8/d' node_modules/whisper.rn/android/src/main/CMakeLists.txt || true
          fi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-android-arm64-${{ github.sha }}
          restore-keys: ccache-android-arm64-

      - name: Set up ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ccache
          fi
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime"
          } >> "$GITHUB_ENV"
          CCACHE_DIR="$HOME/.ccache" ccache --zero-stats || true

      - name: Ensure google-services.json Exists
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.pocketpalai"
                  }
                },
                "api_key": [{
                  "current_key": "dummy-api-key-for-ci-builds"
                }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:1111111111111111",
                  "android_client_info": {
                    "package_name": "com.pocketpalai.e2e"
                  }
                },
                "api_key": [{
                  "current_key": "dummy-api-key-for-ci-builds"
                }]
              }
            ]
          }
          EOL

      - name: Ensure .env File Exists
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          APP_RELEASE_STORE_PASSWORD=dummy-ci-password
          APP_RELEASE_KEY_PASSWORD=dummy-ci-password
          EOL

      - name: Ensure Release Keystore Exists
        working-directory: android/app
        run: |
          rm -f pocketpal-release-key.keystore
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore pocketpal-release-key.keystore \
            -alias pocketpal_key_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dummy-ci-password \
            -keypass dummy-ci-password \
            -dname "CN=CI Build, OU=CI, O=PocketPal, L=CI, S=CI, C=US"

      - name: Build Android Prod Release APK (Single-Variant arm64-v8a Fast Build)
        working-directory: android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew || true
          ./gradlew assembleProdRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -PrnllamaBuildFromSource=true \
            -PrnllamaVariants=rnllama \
            --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/prod/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/ -name "*.apk" | head -n 1)
          fi
          echo "Built APK at: $APK_PATH"
          cp "$APK_PATH" pocketpal-ai-release.apk
          ls -lh pocketpal-ai-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketpal-ai-release-apk
          path: pocketpal-ai-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.22.0-enhanced-${{ github.run_number }}
          name: PocketPal AI Enhanced Release (Build #${{ github.run_number }})
          draft: false
          prerelease: false
          files: pocketpal-ai-release.apk
