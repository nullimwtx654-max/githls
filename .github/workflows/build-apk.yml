name: Build Android APK

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (Release or Debug)'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Android APK (Fast arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack & Setup Yarn 3
        run: |
          corepack enable
          yarn --version

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JS Dependencies (Guaranteed node_modules linker)
        run: |
          yarn config set nodeLinker node-modules
          yarn config set enableImmutableInstalls false
          yarn install --mode=skip-build || yarn install
          if [ ! -d "node_modules/@react-native/gradle-plugin" ]; then
            echo "Forcing node_modules linker rebuild..."
            rm -rf .yarn/cache node_modules
            YARN_NODE_LINKER=node-modules yarn install
          fi
          test -d "node_modules/@react-native/gradle-plugin"

      - name: Configure Pre-Installed Android SDK, NDK 27.1.12297006 & OpenCL Headers
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1 || which sdkmanager)
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.31.6"
          sudo apt-get update -y
          sudo apt-get install -y ninja-build ocl-icd-opencl-dev opencl-headers clinfo

      - name: Prepare Environment, Firebase Config & Keystore
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          chmod +x android/gradlew
          mkdir -p android/app/src/debug android/app/src/release android/app/src/prod/release android/app/src/prod/debug
          if [ ! -f android/app/google-services.json ]; then
            cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "pocketpal-local-build",
              "storage_bucket": "pocketpal-local-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.pocketpalai" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForLocalCompilation000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": { "package_name": "com.pocketpal" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForLocalCompilation000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000002",
                  "android_client_info": { "package_name": "com.pocketpalai.e2e" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForLocalCompilation000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          cp android/app/google-services.json android/app/src/debug/google-services.json
          cp android/app/google-services.json android/app/src/release/google-services.json
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Initialize llama.rn C++ Sources for Single-Variant Fast Build
        run: |
          if [ -d "node_modules/@pocketpalai/llama.rn" ] && [ ! -f "node_modules/@pocketpalai/llama.rn/cpp/ggml.c" ]; then
            echo "Populating @pocketpalai/llama.rn C++ sources..."
            git clone --depth 1 https://github.com/mybigday/llama.rn.git /tmp/llama-rn-src || true
            if [ -d "/tmp/llama-rn-src/cpp" ]; then
              cp -rn /tmp/llama-rn-src/cpp/* node_modules/@pocketpalai/llama.rn/cpp/ || true
            fi
          fi

      - name: Pre-Verify Metro JS Bundle
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          mkdir -p /tmp/metro-verify
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/metro-verify/index.android.bundle \
            --assets-dest /tmp/metro-verify/assets
          rm -rf /tmp/metro-verify

      - name: Build Android APK (Single-Variant arm64-v8a Fast Build ~10m)
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6144m -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'Release' }}"
          if [ "$BUILD_TYPE" = "Debug" ]; then
            TASK="assembleProdDebug"
          else
            TASK="assembleProdRelease"
          fi
          ./gradlew "$TASK" \
            -PreactNativeArchitectures=arm64-v8a \
            -PrnllamaBuildFromSource=true \
            -PrnllamaVariants=rnllama \
            --no-daemon --stacktrace

      - name: Collect Built APK into Root Output Folder
        run: |
          mkdir -p dist-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp -v {} dist-apk/ \;
          ls -lh dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-AI-arm64-v8a-APK
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30
