name: Build PocketPal APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLUS_STORE_GATE: 'true'
      APP_RELEASE_STORE_PASSWORD: dummy-ci-password
      APP_RELEASE_KEY_PASSWORD: dummy-ci-password
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Auto-Extract ZIP (If Uploaded as ZIP) & Normalize Project Root
        run: |
          set -e
          # 1. If ANY .zip archive was uploaded to the repo, extract it and overwrite root files
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -not -path "*/node_modules/*" -not -path "*/.git/*" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found archive $ZIP_FILE — extracting into temporary staging directory..."
            STAGE_DIR=$(mktemp -d)
            unzip -q -o "$ZIP_FILE" -d "$STAGE_DIR"
            rm -f "$ZIP_FILE"
            PKG_JSON=$(find "$STAGE_DIR" -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$PKG_JSON" ]; then
              SRC_ROOT=$(dirname "$PKG_JSON")
              echo "Copying extracted project files from $SRC_ROOT into workspace root..."
              cp -rf "$SRC_ROOT"/. .
            fi
            rm -rf "$STAGE_DIR"
          fi

          # 2. If a nested subfolder (e.g. ./pocketpal-ai-main) contains package.json, overwrite root and remove the duplicate subfolder
          for SUB_PKG in $(find . -mindepth 2 -maxdepth 2 -name "package.json" -not -path "*/node_modules/*" -not -path "*/.git/*"); do
            SUBDIR=$(dirname "$SUB_PKG")
            echo "Found nested project folder $SUBDIR — syncing into workspace root and removing duplicate..."
            cp -rf "$SUBDIR"/. .
            rm -rf "$SUBDIR"
          done

          # 3. Strip Windows CRLF line endings and ensure scripts are executable
          find . \( -name "*.sh" -o -name "*.patch" -o -name "gradlew" -o -name ".env" \) -not -path "*/node_modules/*" -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          chmod +x scripts/*.sh android/gradlew 2>/dev/null || true

          # 4. Ensure android/gradle.properties and android/app/build.gradle ABI settings are consistent
          sed -i 's/reactNativeArchitectures=arm64-v8a$/reactNativeArchitectures=arm64-v8a,x86_64/' android/gradle.properties || true
          sed -i '/rnllamaBuildFromSource=false/d' android/gradle.properties || true
          python3 -c '
          p = "android/app/build.gradle"
          with open(p, "r") as f: c = f.read()
          old = "ndk {\n            abiFilters \"arm64-v8a\", \"x86_64\"\n        }"
          new = "ndk {\n            def archs = project.findProperty(\"reactNativeArchitectures\")\n            if (archs) { abiFilters (*archs.toString().split(\",\")) } else { abiFilters \"arm64-v8a\", \"x86_64\" }\n        }"
          if old in c:
              with open(p, "w") as f: f.write(c.replace(old, new, 1))
          ' || true

      - name: Maximize Build Space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache || true
          sudo mkdir -p /opt/hostedtoolcache
          sudo chmod -R 777 /opt/hostedtoolcache
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock', 'patches/**') }}

      - name: Install Yarn & Dependencies
        run: |
          npm install -g yarn || true
          yarn install --network-timeout 600000
          OPENCL_HEADERS_DIR="node_modules/llama.rn/third_party/OpenCL-Headers"
          if [ ! -d "$OPENCL_HEADERS_DIR" ]; then
            mkdir -p "node_modules/llama.rn/third_party"
            git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git "$OPENCL_HEADERS_DIR"
          fi

      - name: Derive rnllama Variant Allowlist
        run: |
          set -euo pipefail
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          echo "Declared allowlist: $VARIANTS"
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$VARIANTS" >> "$GITHUB_ENV"

      - name: Cache llama.rn Native Build Tree
        uses: actions/cache@v4
        with:
          path: node_modules/llama.rn/android/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('yarn.lock', 'patches/**', 'scripts/android-payload-manifest.json') }}

      - name: Set up Hexagon SDK
        run: |
          set -euo pipefail
          HEXAGON_SDK_VERSION="6.4.0.2"
          HEXAGON_TOOLS_VERSION="19.0.04"
          SDK_ROOT="$HOME/.hexagon-sdk/$HEXAGON_SDK_VERSION"
          TOOLS_ROOT="$SDK_ROOT/tools/HEXAGON_Tools/$HEXAGON_TOOLS_VERSION"
          if [ ! -d "$SDK_ROOT" ]; then
            STAGE=$(mktemp -d)
            echo "Downloading Hexagon SDK $HEXAGON_SDK_VERSION..."
            curl -fsSL -o "$STAGE/sdk.tar.xz" \
              "https://github.com/snapdragon-toolchain/hexagon-sdk/releases/download/v${HEXAGON_SDK_VERSION}/hexagon-sdk-v${HEXAGON_SDK_VERSION}-amd64-lnx.tar.xz"
            mkdir -p "$STAGE/unpacked"
            tar --use-compress-program='xz -T0 -d' -xf "$STAGE/sdk.tar.xz" -C "$STAGE/unpacked"
            rm -f "$STAGE/sdk.tar.xz"
            mkdir -p "$HOME/.hexagon-sdk"
            if [ -d "$STAGE/unpacked/incs" ]; then
              mv "$STAGE/unpacked" "$SDK_ROOT"
            else
              INNER=$(find "$STAGE/unpacked" -maxdepth 1 -mindepth 1 -type d | head -n 1)
              mv "$INNER" "$SDK_ROOT"
            fi
          fi
          echo "HEXAGON_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "HEXAGON_TOOLS_ROOT=$TOOLS_ROOT" >> "$GITHUB_ENV"

      - name: Set up ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ccache
          fi
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime"
          } >> "$GITHUB_ENV"

      - name: Ensure google-services.json Exists
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.pocketpalai"
                  }
                },
                "api_key": [{
                  "current_key": "dummy-api-key-for-ci-builds"
                }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:1111111111111111",
                  "android_client_info": {
                    "package_name": "com.pocketpalai.e2e"
                  }
                },
                "api_key": [{
                  "current_key": "dummy-api-key-for-ci-builds"
                }]
              }
            ]
          }
          EOL

      - name: Ensure .env File Exists
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          APP_RELEASE_STORE_PASSWORD=dummy-ci-password
          APP_RELEASE_KEY_PASSWORD=dummy-ci-password
          EOL

      - name: Ensure Release Keystore Exists
        working-directory: android/app
        run: |
          rm -f pocketpal-release-key.keystore
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore pocketpal-release-key.keystore \
            -alias pocketpal_key_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dummy-ci-password \
            -keypass dummy-ci-password \
            -dname "CN=CI Build, OU=CI, O=PocketPal, L=CI, S=CI, C=US"

      - name: Build Android Prod Release APK
        working-directory: android
        run: |
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew || true
          echo "=== Building Android Release APK (Fast Prebuilt Mode) ==="
          if ORG_GRADLE_PROJECT_rnllamaBuildFromSource=false ./gradlew assembleProdRelease -PrnllamaBuildFromSource=false --stacktrace; then
            echo "Fast prebuilt APK build succeeded!"
          else
            echo "Prebuilt build failed; falling back to full from-source NDK build (rnllamaBuildFromSource=true)..."
            ./gradlew clean || true
            ORG_GRADLE_PROJECT_rnllamaBuildFromSource=true ./gradlew assembleProdRelease -PrnllamaBuildFromSource=true --stacktrace
          fi

      - name: Prepare APK Output
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/prod/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/ -name "*.apk" | head -n 1)
          fi
          echo "Built APK at: $APK_PATH"
          cp "$APK_PATH" pocketpal-ai-release.apk
          ls -lh pocketpal-ai-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketpal-ai-release-apk
          path: pocketpal-ai-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.22.0-enhanced-${{ github.run_number }}
          name: PocketPal AI Enhanced Release (Build #${{ github.run_number }})
          draft: false
          prerelease: false
          files: pocketpal-ai-release.apk
