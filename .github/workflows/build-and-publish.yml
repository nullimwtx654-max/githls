name: Build APK and Publish

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect APK Files
        run: |
          mkdir -p dist
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload APKs as Artifact (Direct Download in Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: VoxelCraft-Ultra-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v3.2.{0}', github.run_number) }}
          name: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('VoxelCraft Ultra v3.2.{0}', github.run_number) }}
          draft: false
          prerelease: false
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
