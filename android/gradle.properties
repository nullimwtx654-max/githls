# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# AndroidX package structure
android.useAndroidX=true

# Build arm64-v8a by default for fast Android device builds
reactNativeArchitectures=arm64-v8a

# Enable React Native New Architecture (TurboModules & Fabric)
newArchEnabled=true

# Enable Hermes JS engine
hermesEnabled=true

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
android.builtInKotlin=false
android.newDsl=false
