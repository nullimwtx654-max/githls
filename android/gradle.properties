# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX package structure
android.useAndroidX=true

# Must match android/app/build.gradle ndk.abiFilters ("arm64-v8a", "x86_64")
reactNativeArchitectures=arm64-v8a,x86_64

# Enable React Native New Architecture (TurboModules & Fabric)
newArchEnabled=true

# Enable Hermes JS engine
hermesEnabled=true

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
android.builtInKotlin=false
android.newDsl=false
